<style>
:root{--primary:#15803D;--soft:#e8f3ec;--soft:color-mix(in srgb,var(--primary) 11%,#fff);--bg:#F4F6F4;--card:#fff;--ink:#14201A;--muted:#6B7A72;--line:#E1E8E3;--ok:#15803D;--danger:#B3261E;--r:20px;--bar:56px;--sat:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0}h3{font-size:16px}small,.sub,.hint{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
label{display:block;margin:12px 0 6px;font-size:13px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.row>input{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:13px 16px;border-radius:14px;background:var(--primary);color:#fff;font-weight:700}
.btn.sm{width:auto;margin:0;padding:12px 18px}.btn.ghost{background:var(--soft);color:var(--primary)}.btn.ok{background:var(--ok)}.btn.danger{background:#fbe9e7;color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.loading{opacity:.7;pointer-events:none}
.link{color:var(--primary);font-weight:600;padding:6px 2px}.link:disabled{color:var(--muted)}
.x{font-size:24px;line-height:1;color:var(--muted);padding:4px 8px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(60,30,10,.05),0 6px 20px rgba(60,30,10,.05)}
.card h3{margin-bottom:10px}
.ok{color:var(--ok)}.err{color:var(--danger)}
/* layout */
.shell{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(var(--bar) + 62px + var(--sat)) 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 4px}
.top small{display:block}.top b{font-size:19px}.top .mc{font-size:14px;font-weight:700;color:var(--primary);letter-spacing:.5px;white-space:nowrap}.top>div{min-width:0}
.role{background:var(--soft);color:var(--primary);font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px}
.nav{display:flex;justify-content:center;gap:4px;padding:6px 10px 8px;max-width:520px;margin:0 auto}
.nav button{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600}
.nav button.on{color:var(--primary);background:var(--soft)}
/* login */
.login{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.login-hero{padding:56px 24px 40px;text-align:center;color:#fff;background:linear-gradient(160deg,var(--primary),color-mix(in srgb,var(--primary) 55%,#000));border-radius:0 0 32px 32px}
.login-hero .logo{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.login-hero .logo svg{width:36px;height:36px}.login-hero h1{font-size:26px}.login-hero p{margin:6px 0 0;opacity:.85}
.sheet{padding:22px 22px 40px}.sheet h2{font-size:21px}.sheet .sub{margin:4px 0 8px}
.seg{display:flex;background:var(--soft);padding:4px;border-radius:12px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.otp{text-align:center;font-size:28px;letter-spacing:.5em;font-weight:700;padding-left:.5em}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;margin:14px 0 0}.chk input{width:20px;height:20px;accent-color:var(--primary);padding:0}
/* hero events */
.hero-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -16px 0;padding:0 16px;scrollbar-width:none}
.hero-track::-webkit-scrollbar{display:none}
.hero{flex:0 0 90%;scroll-snap-align:center;height:176px;border-radius:22px;position:relative;color:#fff;overflow:hidden;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(140deg,var(--primary),color-mix(in srgb,var(--primary) 50%,#000)) center/cover}
.hero.solo{flex-basis:100%}.hero[data-link]{cursor:pointer}
.hero .badge{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:700}
.hero .badge i{width:7px;height:7px;border-radius:50%;background:#5CF08A;animation:pulse 1.6s infinite}
.hero h3{font-size:20px;text-shadow:0 1px 8px rgba(0,0,0,.4)}.hero p{margin:3px 0 0;font-size:13px;opacity:.92}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 0}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.2s}.dots i.on{width:18px;border-radius:4px;background:var(--primary)}
.nohero{border:1.5px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted);margin-top:10px}
@keyframes pulse{50%{opacity:.3}}
/* stamp card */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 8px}
.slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);color:#cbbcae;font-weight:700;font-size:13px}
.slot.f{background:var(--primary);border:2px solid var(--primary);color:#fff}
.slot.f svg{width:55%;height:55%}
@keyframes stampIn{0%{transform:scale(3) rotate(-25deg);opacity:0}55%{transform:scale(.8) rotate(4deg);opacity:1}100%{transform:scale(1)}}
.slot.new{animation:stampIn .7s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:var(--d,0ms)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--soft);color:var(--primary);font-weight:700;font-size:13px}.chip.on{background:var(--primary);color:#fff}
.kcard{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-top:12px;background:#fffdfb}.kcard.full{border-color:var(--ok)}
.camp-h{display:flex;align-items:center;gap:10px}.camp-h .ci{font-size:28px}
.notice{background:#fff6e5;border:1px solid #f1d9a6;color:#7a5a12;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.mini{display:flex;align-items:center;gap:6px}.mini button{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--primary);font-weight:700}.mini b{min-width:20px;text-align:center}
.fx{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(30,15,5,.5);animation:fxout .4s 2.1s forwards;pointer-events:none}
.fx .st{width:150px;height:150px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;animation:stampDrop .8s cubic-bezier(.2,.9,.3,1.2) both}
.fx .st svg{width:80px;height:80px;stroke-width:1.6}
.fx .ring{position:absolute;width:150px;height:150px;border-radius:50%;border:4px solid #fff;animation:ring 1s .45s ease-out both}
.fx .tx{position:absolute;top:calc(50% + 100px);color:#fff;font-weight:800;font-size:28px;text-shadow:0 2px 12px rgba(0,0,0,.5);text-align:center;animation:fadeUp .5s .5s both}
@keyframes stampDrop{0%{transform:scale(3.2) rotate(-30deg);opacity:0}55%{transform:scale(.85) rotate(5deg);opacity:1}75%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.8);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes fxout{to{opacity:0}}
.slot.m{border:2px solid var(--primary);color:var(--primary);font-size:17px}
.slot.m.f{background:var(--primary);color:#fff}.slot.m.claimed{background:var(--ok);border-color:var(--ok);color:#fff}
.slot.m.available{animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--primary) 22%,transparent)}}
.ico.lk{background:#f0ece8;color:#a99b8f}.pill.ok{background:#e6f5ec;color:var(--ok)}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:9px;transition:width .5s}
.ready{background:linear-gradient(135deg,#e6f5ec,#f4fbf7);border:1.5px solid #b9e0c8;border-radius:14px;padding:12px 14px;margin-top:12px;color:#1d5c38;font-weight:600}
.ready small{display:block;font-weight:400;color:#4d7a60}
.big{font-size:34px;font-weight:800;line-height:1}
/* lists */
.list>div{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.list>div:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--primary);flex:none;font-weight:800;font-size:13px}
.ico.g{background:#e6f5ec;color:var(--ok)}.ico.r{background:#fbe9e7;color:var(--danger)}
.list .t{flex:1;min-width:0}.list .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list .t small{display:block}
.empty{text-align:center;color:var(--muted);padding:18px 0}
/* kasir */
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:10px 0}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--primary);font-size:24px;font-weight:700}
.stepper b{font-size:30px;min-width:40px;text-align:center}
.prog{margin:6px 0 0;color:var(--muted);font-size:13px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--soft);border-radius:14px;padding:12px}.tile b{display:block;font-size:24px;color:var(--primary)}.tile small{font-size:12px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--primary)}.pill.off{background:#eee;color:#777}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(30,15,5,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;animation:fade .2s}
.modal{width:100%;max-width:520px;max-height:84vh;overflow:auto;background:#fff;border-radius:26px;padding:20px;animation:pop .2s}@keyframes pop{from{transform:scale(.94);opacity:0}}

@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.qrbox{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:12px;width:min(300px,100%);margin:12px auto}.qrbox img{display:block;width:100%;image-rendering:pixelated}
.center{text-align:center}.code{font-size:22px;font-weight:800;letter-spacing:.12em;color:var(--primary)}
video{width:100%;border-radius:16px;background:#000;aspect-ratio:1;object-fit:cover}
#netbar{position:fixed;left:0;top:0;right:0;height:3px;z-index:90;overflow:hidden;opacity:0;transition:opacity .15s;pointer-events:none}
#netbar.on{opacity:1}#netbar::before{content:"";position:absolute;top:0;bottom:0;width:40%;background:var(--primary);border-radius:3px;animation:netslide 1s ease-in-out infinite}
@keyframes netslide{0%{left:-40%}100%{left:100%}}
#blocker{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(43,29,20,0)}
#blocker.lock{display:flex}#blocker.on{background:rgba(43,29,20,.28)}
#blocker .box{display:none;align-items:center;gap:10px;background:#fff;color:#2B1D14;padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#blocker.on .box{display:flex}
.sp,.btn.loading::after,button.loading::after{content:"";width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.btn.loading{opacity:.8}
.skel{padding:20px 16px;display:flex;flex-direction:column;gap:14px;max-width:460px;margin:0 auto}.sk{border-radius:16px;background:linear-gradient(90deg,#eee4da 25%,#f7f0e8 50%,#eee4da 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}.sk.h{height:44px;width:60%}.sk.c{height:150px}.sk.b{height:48px}@keyframes shim{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;top:calc(var(--bar) + 70px + var(--sat));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:90%;max-width:460px}
#toast div{background:#2B1D14;color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;animation:pop .2s;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
#toast div.err{background:var(--danger)}#toast div.ok{background:var(--ok)}
.spin{display:grid;place-items:center;height:60vh;color:var(--muted)}
.ev-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.ev-item:first-child{border-top:0}
.ev-th{width:64px;height:48px;border-radius:12px;background:var(--soft) center/cover;flex:none}

/* ===== rasa aplikasi HP ===== */
html,body{overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-size:16px}
.appbar{position:fixed;left:0;right:0;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.brand{display:flex;align-items:center;gap:10px;height:var(--bar);padding:0 16px;max-width:520px;margin:0 auto}
.brand img{width:34px;height:34px;border-radius:9px;object-fit:contain;background:#fff}
.brand .bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}.brand .bt b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand .bt small{font-size:11.5px;font-weight:600;color:var(--primary)}
.nav button{transition:background .18s,color .18s,transform .12s}.nav button:active{transform:scale(.93)}
.nav button.on svg{transform:translateY(-1px)}
.btn{transition:transform .12s,opacity .15s,filter .15s}.btn:active{transform:scale(.97);filter:brightness(.95)}
.card{box-shadow:0 1px 2px rgba(10,40,20,.05),0 8px 24px rgba(10,40,20,.06)}
.vin{animation:vin .28s cubic-bezier(.2,.8,.3,1)}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
#ptr{height:0;opacity:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--primary);transition:height .2s,opacity .2s}
#ptr .sp{width:20px;height:20px;animation:none;transform:rotate(0)}#ptr.rdy .sp{border-right-color:currentColor}#ptr.spinning .sp{animation:rot .7s linear infinite}
.login-hero{background:#fff;color:var(--ink);border-radius:0;padding:calc(48px + var(--sat)) 24px 18px}
.login-hero .logo-big{width:150px;height:auto;display:block;margin:0 auto 12px}
.login-hero h1{font-size:24px}.login-hero p{opacity:1;color:var(--muted)}
.overlay{align-items:center}.modal{border-radius:28px}
.login .sheet{background:#fff;margin:0 12px;border-radius:26px;box-shadow:0 8px 30px rgba(10,40,20,.08)}
#splash{position:fixed;inset:0;z-index:200;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s,transform .4s}
#splash img{width:min(52vw,230px);height:auto;animation:sIn .7s cubic-bezier(.2,.8,.3,1) both}
#splash i{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom));width:26px;height:26px;border:3px solid #15803D;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
@keyframes sIn{from{opacity:0;transform:scale(.86)}}
@media (display-mode:standalone){body{padding-bottom:env(safe-area-inset-bottom)}}
</style>
</head>
<body>
<div id="splash"><img src="logo.png" alt="AIUEO Cafe"><i></i></div>
<div id="netbar"></div><div id="blocker"><div class="box"><span class="sp"></span>Memproses…</div></div>
<div id="app"></div>
<div id="toast"></div>
<style>
#pwa{position:fixed;left:12px;right:12px;top:calc(var(--bar) + 70px + var(--sat));z-index:40;max-width:496px;margin:0 auto;background:#14201A;color:#fff;border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:10px;font:600 13px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#pwa button{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}#pwa .go{background:#fff;color:#14201A}#pwa .no{background:transparent;color:#fff;opacity:.7}
</style>
<div id="pwa"><span id="pwat" style="flex:1"></span><button class="go" id="pwago">Pasang</button><button class="no" id="pwano">Nanti</button></div>
<script src="config.js"></script>
<script src="api-client.js"></script>
<script>
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&!a.children.length){var s=document.getElementById('splash');if(s)s.remove();a.innerHTML='<div style="padding:28px;text-align:center;font:14px system-ui"><b>Gagal memuat aplikasi</b><br><small>'+String(e.message).replace(/</g,'&lt;')+'</small><br><br><button onclick="location.reload()" style="padding:10px 18px">Muat ulang</button></div>';}});
/* mulai bootstrap lebih awal untuk yang sudah login (paralel dengan memuat app.js) */
(function(){var t=null;try{t=localStorage.getItem('ls_token')||sessionStorage.getItem('ls_token');}catch(e){}
if(t)window.__boot=LSAPI.post(['bootstrap',t,{}]).catch(function(){return null;});})();
(function(){
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  var st=matchMedia('(display-mode: standalone)').matches||navigator.standalone,seen=0;try{seen=Number(localStorage.getItem('ls_pwa_no'))||0;}catch(e){}
  if(st||Date.now()-seen<7*864e5)return;
  var box=document.getElementById('pwa'),txt=document.getElementById('pwat'),go=document.getElementById('pwago'),no=document.getElementById('pwano'),ev=null;
  function show(t,l){txt.textContent=t;go.textContent=l;go.style.display=l?'':'none';box.style.display='flex';}
  no.onclick=function(){box.style.display='none';try{localStorage.setItem('ls_pwa_no',String(Date.now()));}catch(e){}};
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;show('Pasang AIUEO Cafe di layar utama.','Pasang');});
  go.onclick=function(){if(!ev)return;ev.prompt();ev.userChoice.then(function(){box.style.display='none';ev=null;});};
  addEventListener('appinstalled',function(){box.style.display='none';});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))setTimeout(function(){show('Untuk memasang: ketuk Bagikan lalu "Tambah ke Layar Utama".','');},2500);
})();
</script>
<script src="app.js"></script>
</body>
</html>
